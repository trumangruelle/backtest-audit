<!doctype html>
<!-- Gallery card for the backtest-audit listing. Rendered to PNG with headless Edge at 1280x769 (Fiverr) and 1200x900
     (Upwork, 4:3). Figures from FACTS.json projects.backtest-audit-demo. At most 10 words of text (Fiverr's limit). -->
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;height:100%;background:#0f172a;font-family:Segoe UI,Arial,sans-serif;color:#e2e8f0}
  .wrap{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4vh}
  .row{display:flex;gap:6vw;align-items:center}
  .card{background:#1e293b;border-radius:18px;padding:4vh 4vw;text-align:center;min-width:28vw}
  .label{font-size:3.6vh;letter-spacing:.08em;text-transform:uppercase;color:#94a3b8}
  .big{font-size:11vh;font-weight:700;margin-top:1vh}
  .up{color:#4ade80}.down{color:#f87171}
  .arrow{font-size:10vh;color:#64748b}
  .fails{display:flex;gap:1.4vw;margin-top:2vh}
  .chip{background:#7f1d1d;color:#fecaca;border-radius:10px;padding:1.2vh 1.6vw;font-size:3.4vh;font-weight:700}
</style></head><body><div class="wrap">
  <div class="row">
    <div class="card"><div class="label">Reported</div><div class="big up">$16,721</div></div>
    <div class="arrow">&rarr;</div>
    <div class="card"><div class="label">Run correctly</div><div class="big down">&minus;$1,534</div></div>
  </div>
  <div class="fails"><div class="chip">5 of 5 checks failed</div></div>
</div></body></html>
